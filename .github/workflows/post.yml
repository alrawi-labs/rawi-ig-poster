name: Instagram Post

on:
  schedule:
    - cron: "*/30 * * * *" # UTC; saat dilimi dönüşümünü script yapıyor (Europe/Istanbul)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Paylaşma, sadece ne yapacağını yazdır"
        type: boolean
        default: true
      test_now:
        description: 'Test saati (İstanbul), örn. 2026-10-28T15:00 (boş = şimdi)'
        required: false
        default: ""

permissions:
  contents: write

# Aynı anda iki çalışma JSON'u bozmasın
concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Publish due posts
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_API_VERSION: v23.0
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
          TEST_NOW: ${{ github.event.inputs.test_now }}
          TIKTOK_ENABLED: "false"    # her şey hazır olunca "true" yap
          TIKTOK_PRIVACY: SELF_ONLY  # audit onayından sonra PUBLIC_TO_EVERYONE
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: node scripts/publish.mjs

      # Script hata verse bile, paylaşılmış olanların durumunu kaydet (çift paylaşımı önler)
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p state
          git add content state
          if ! git diff --cached --quiet; then
            git commit -m "chore: update post state [skip ci]"
            git pull --rebase
            git push
          fi